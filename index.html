<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DE Odoo Pricing Estimator</title>
<style>
:root { --ink:#251f21; --ink2:#585254; --hair:#eae9ea; --raised:#f4efec; --accent:#2e7d5b; --blue:#1a5fb4; }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--raised); color:var(--ink); font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Kufi Arabic',sans-serif; }
.de-page { max-width: 880px; margin: 0 auto; padding: 20px 16px 64px; }
.de-root { display:flex; flex-direction:column; gap:20px; }
.de-brandbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.de-logo { height:44px; width:auto; }
.de-odoo-logo { height:26px; width:auto; }
.de-partner { font-size:12px; color:var(--ink2); border:1px solid var(--hair); border-radius:999px; padding:2px 10px; background:#fff; }
.de-langbtn { margin-inline-start:auto; border:1px solid var(--hair); background:#fff; border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer; color:var(--ink); min-height:36px; }
.de-langbtn:hover { background:var(--raised); }
.de-header h1.de-title { font-size:26px; margin:0 0 6px; }
.de-intro { margin:0; color:var(--ink2); font-size:14px; line-height:1.6; }
.de-callout { background:#fdf6e5; border:1px solid #f0e2b6; border-radius:12px; padding:12px 14px; }
.de-callout-title { font-weight:700; font-size:13px; margin-bottom:4px; color:#6b5410; }
.de-callout-body { font-size:13px; line-height:1.6; color:#5c4d1c; }
.de-group { background:#fff; border:1px solid var(--hair); border-radius:14px; padding:16px; }
.de-group-title { margin:0 0 10px; font-size:17px; }
.de-caption { font-size:12px; color:var(--ink2); margin:6px 0; line-height:1.5; }
.de-grid { display:grid; gap:12px; }
.de-settings { grid-template-columns:1fr; }
@media (min-width:640px){ .de-settings { grid-template-columns:1fr 1fr; } }
@media (min-width:900px){ .de-settings { grid-template-columns:1fr 1fr 1fr; } }
.de-field { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink2); }
.de-field.de-check { flex-direction:row; align-items:center; gap:8px; color:var(--ink); }
.de-field input[type="checkbox"] { width:18px; height:18px; accent-color:var(--accent); }
.de-num { border:1px solid var(--hair); border-radius:6px; padding:6px 8px; font-size:14px; width:96px; color:var(--ink); background:#fff; }
.de-num.de-text { width:100%; }
.de-num:focus { outline:2px solid #2e7d5b44; border-color:var(--accent); }
.de-seg { display:inline-flex; border:1px solid var(--hair); border-radius:8px; overflow:hidden; }
.de-seg button { border:none; background:#fff; padding:7px 12px; font-size:13px; cursor:pointer; color:var(--ink); min-height:36px; }
.de-seg button.on { background:var(--blue); color:#fff; }
.de-modgroup { margin-top:12px; }
.de-modgroup-title { font-weight:600; font-size:14px; margin-bottom:6px; color:var(--ink); }
.de-mods { grid-template-columns:repeat(2,1fr); display:grid; }
@media (min-width:640px){ .de-mods { grid-template-columns:repeat(3,1fr); } }
@media (min-width:900px){ .de-mods { grid-template-columns:repeat(4,1fr); } }
.de-mod { border:1px solid var(--hair); border-radius:10px; padding:8px 10px; background:#fff; }
.de-mod.on { border-color:var(--accent); background:#2e7d5b0d; }
.de-mod-head { display:flex; align-items:center; gap:8px; cursor:pointer; }
.de-mod-head input { width:16px; height:16px; accent-color:var(--accent); flex:none; }
.de-ic { width:28px; height:28px; flex:none; display:inline-flex; }
.de-ic svg { width:28px; height:28px; }
.de-ic-sm { width:18px; height:18px; flex:none; display:inline-flex; }
.de-ic-sm svg { width:18px; height:18px; }
.de-modname { font-size:13px; color:var(--ink); line-height:1.25; }
.de-mod-hours { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:var(--ink2); }
.de-line { border:1px solid var(--hair); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
.de-line.on { border-color:var(--accent); background:#2e7d5b0d; }
.de-line-head { display:flex; align-items:center; gap:8px; cursor:pointer; flex-wrap:wrap; }
.de-line-head input { width:16px; height:16px; accent-color:var(--accent); flex:none; }
.de-linename { font-size:13px; color:var(--ink); }
.de-ev { font-size:11px; color:var(--ink2); background:var(--raised); border-radius:999px; padding:2px 8px; margin-inline-start:auto; }
.de-line-hours { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:var(--ink2); }
.de-selitems { margin-bottom:12px; display:flex; flex-direction:column; gap:4px; }
.de-selrow { display:flex; align-items:center; gap:8px; font-size:13px; border-bottom:1px dashed var(--hair); padding:4px 0; }
.de-selname { flex:1; color:var(--ink); }
.de-selval { color:var(--ink2); white-space:nowrap; display:inline-flex; gap:6px; }
.de-table { width:100%; border-collapse:collapse; font-size:14px; }
.de-table th, .de-table td { text-align:start; padding:8px 6px; border-bottom:1px solid var(--hair); }
.de-table th { font-size:12px; color:var(--ink2); font-weight:600; }
.de-table td[dir="ltr"] { text-align:end; }
.de-totalrow td { font-weight:600; }
.de-grand td { font-weight:700; font-size:16px; color:var(--blue); border-bottom:none; }
.de-sharecell { min-width:110px; }
.de-bar { display:inline-block; width:70px; height:8px; background:var(--raised); border-radius:999px; overflow:hidden; vertical-align:middle; margin-inline-end:6px; }
.de-barfill { display:block; height:100%; background:var(--accent); border-radius:999px; }
.de-barpct { font-size:12px; color:var(--ink2); }
.de-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.file-button { border:1px solid transparent; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; min-height:38px; }
.file-button.is-compact { padding:7px 14px; }
.file-button[data-variant="primary"] { background:var(--blue); color:#fff; }
.file-button[data-variant="secondary"] { background:#fff; color:var(--ink); border-color:var(--hair); }
.file-button[data-variant="ghost"] { background:transparent; color:var(--ink2); border-color:var(--hair); }
.de-minibtn { border:1px solid var(--hair); background:#fff; border-radius:6px; font-size:12px; padding:4px 10px; cursor:pointer; color:var(--ink); }
.de-minibtn-danger { color:#b3261e; }
.de-closing { font-size:12px; color:var(--ink2); line-height:1.6; border-top:1px solid var(--hair); padding-top:12px; }
@media print {
  .no-print, .de-langbtn, .de-actions, .de-brandbar button { display:none !important; }
  .de-mod:not(.on), .de-line:not(.on) { display:none !important; }
  .de-mods { grid-template-columns:repeat(3,1fr); }
  body { background:#fff; }
  .de-group { border:none; padding:8px 0; }
}
@media (max-width:420px){ .de-mods { grid-template-columns:1fr; } }

</style>
</head>

<div class="de-page"><div id="app"></div></div>

    partner: { en: 'Odoo Partner', ar: 'شريك Odoo' },
    closing: { en: 'Defaults informed by past DE quotations and proposals; assumptions are marked on each line. Rates and hours here are working estimates only, reviewed by DE management before any client quotation is issued.', ar: 'القيم الافتراضية مستندة إلى عروض أسعار وعروض سابقة لشركة DE، والافتراضات موضحة على كل بند. الأسعار والساعات هنا تقديرات عمل فقط تُراجع من إدارة DE قبل إصدار أي عرض سعر للعميل.' },
    hoursShort: { en: 'h', ar: 'h' },
    free: { en: 'free', ar: 'مجانًا' },
    noneSelected: { en: 'No modules selected yet.', ar: 'لم يتم اختيار تطبيقات بعد.' },
    langBtn: { en: 'العربية', ar: 'English' },
    saveEstimate: { en: 'Save estimate', ar: 'حفظ التقدير' },
    savedEstimates: { en: 'Saved estimates (this browser only)', ar: 'التقديرات المحفوظة (على هذا المتصفح فقط)' },
    noSaves: { en: 'No saved estimates yet.', ar: 'لا توجد تقديرات محفوظة بعد.' },
    loadLbl: { en: 'Load', ar: 'تحميل' },
    delLbl: { en: 'Delete', ar: 'حذف' },
    savedMsg: { en: 'Saved', ar: 'تم الحفظ' },
    reset: { en: 'Reset to defaults', ar: 'إعادة التعيين للافتراضي' },
    untitled: { en: 'Untitled estimate', ar: 'تقدير بدون اسم' }
  };

  var COMPLEXITY = [
    { id: 'simple', factor: 0.85 },
    { id: 'standard', factor: 1.0 },
    { id: 'complex', factor: 1.25 }
  ];

  function usersFactor(users) {
    if (users <= 10) return 1;
    if (users <= 25) return 1.15;
    if (users <= 50) return 1.3;
    if (users <= 100) return 1.5;
    return 1.75;
  }

  var ALL_MODULES = [];
  MODULE_GROUPS.forEach(function (g) { g.modules.forEach(function (m) { ALL_MODULES.push(m); }); });

  function defaults() {
    var hours = {}, custHours = {}, integHours = {};
    ALL_MODULES.forEach(function (m) { hours[m.id] = m.hours; });
    CUSTOMIZATION_ITEMS.forEach(function (i) { custHours[i.id] = i.hours; });
    INTEGRATION_ITEMS.forEach(function (i) { integHours[i.id] = i.hours; });
    return {
      lang: 'en', clientName: '', rate: 30, currency: 'USD', fx: 50,
      vatOn: true, vatRate: 14, discount: 0, users: 10, companies: 1,
      complexity: 'standard', extraCo: 20, selected: {}, hours: hours,
      trainPer: 5, custOn: {}, custHours: custHours, integOn: {}, integHours: integHours,
      supportOn: false, supportHours: 30, free5: false, retainerHours: 0
    };
  }

  var LS_KEY = 'de-estimator-v2';
  var LS_SAVES = 'de-estimator-saves-v2';
  var state = defaults();
  try {
    var saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (saved && typeof saved === 'object') {
      var d = defaults();
      for (var k in d) if (saved[k] !== undefined) d[k] = saved[k];
      state = d;
    }
  } catch (e) {}

  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function getSaves() {
    try { return JSON.parse(localStorage.getItem(LS_SAVES) || '[]'); } catch (e) { return []; }
  }
  function setSaves(s) {
    try { localStorage.setItem(LS_SAVES, JSON.stringify(s)); } catch (e) {}
  }

  function t(k) { return STR[k][state.lang]; }
  function money(usd) {
    if (state.currency === 'EGP') return 'EGP ' + Math.round(usd * state.fx).toLocaleString('en-US');
    return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function num(n) { return n.toLocaleString('en-US', { maximumFractionDigits: 1 }); }

  function calc() {
    var selMods = ALL_MODULES.filter(function (m) { return state.selected[m.id]; });
    var baseImplHours = selMods.reduce(function (s, m) { return s + (state.hours[m.id] || 0); }, 0);
    var cFactor = COMPLEXITY.filter(function (c) { return c.id === state.complexity; })[0].factor;
    var uFactor = usersFactor(state.users || 0);
    var coFactor = 1 + Math.max(0, (state.companies || 1) - 1) * (state.extraCo || 0) / 100;
    var factor = cFactor * uFactor * coFactor;
    var implHours = baseImplHours * factor;
    var trainHours = selMods.length * (state.trainPer || 0);
    var custH = CUSTOMIZATION_ITEMS.filter(function (i) { return state.custOn[i.id]; }).reduce(function (s, i) { return s + (state.custHours[i.id] || 0); }, 0);
    var integH = INTEGRATION_ITEMS.filter(function (i) { return state.integOn[i.id]; }).reduce(function (s, i) { return s + (state.integHours[i.id] || 0); }, 0);
    var flatExtra = INTEGRATION_ITEMS.filter(function (i) { return state.integOn[i.id] && i.flatPrice; }).reduce(function (s, i) { return s + (i.flatPrice || 0); }, 0);
    var supH = (state.supportOn ? state.supportHours || 0 : 0) + (state.retainerHours || 0);
    var implAmt = implHours * state.rate;
    var trainAmt = trainHours * state.rate;
    var custAmt = custH * state.rate;
    var integAmt = integH * state.rate + flatExtra;
    var supAmt = supH * state.rate;
    var subtotal = implAmt + trainAmt + custAmt + integAmt + supAmt;
    var discAmt = subtotal * Math.min(Math.max(state.discount, 0), 100) / 100;
    var afterDisc = subtotal - discAmt;
    var vatAmt = state.vatOn ? afterDisc * Math.max(state.vatRate, 0) / 100 : 0;
    var total = afterDisc + vatAmt;
    return { selMods: selMods, baseImplHours: baseImplHours, cFactor: cFactor, uFactor: uFactor, coFactor: coFactor, factor: factor, implHours: implHours, trainHours: trainHours, custH: custH, integH: integH, flatExtra: flatExtra, supH: supH, implAmt: implAmt, trainAmt: trainAmt, custAmt: custAmt, integAmt: integAmt, supAmt: supAmt, subtotal: subtotal, discAmt: discAmt, vatAmt: vatAmt, total: total };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function numInput(value, onChange, opts) {
    opts = opts || {};
    var inp = el('input', 'de-num');
    if (opts.width) inp.style.width = opts.width + 'px';
    inp.dir = 'ltr';
    inp.type = 'number';
    inp.min = opts.min !== undefined ? opts.min : 0;
    inp.value = value;
    inp.addEventListener('input', function () {
      onChange(parseFloat(inp.value) || 0);
    });
    return inp;
  }

  function buildQuoteText(c) {
    var L = [];
    L.push('Digital Economics - ' + t('title'));
    L.push(new Date().toISOString().slice(0, 10) + (state.clientName ? ' | ' + state.clientName : '') + ' | ' + t('rate') + ': $' + state.rate);
    L.push('');
    function line(name, h, amt, extra) { L.push(name + ': ' + num(h) + 'h x $' + state.rate + (extra || '') + ' = ' + money(amt)); }
    line(t('implementation'), c.implHours, c.implAmt, ' (' + t('factorLine') + ' ' + c.factor.toFixed(2) + ')');
    line(t('training'), c.trainHours, c.trainAmt);
    if (c.custH) line(t('customization'), c.custH, c.custAmt);
    if (c.integH || c.flatExtra) L.push(t('integration') + ': ' + num(c.integH) + 'h x $' + state.rate + (c.flatExtra ? ' + ' + money(c.flatExtra) + ' ' + t('flatItem') : '') + ' = ' + money(c.integAmt));
    if (c.supH) line(t('support'), c.supH, c.supAmt);
    L.push('');
    L.push(t('subtotal') + ': ' + money(c.subtotal));
    if (c.discAmt) L.push(t('discount') + ' ' + state.discount + '%: -' + money(c.discAmt));
    if (state.vatOn) L.push(t('vat') + ' ' + state.vatRate + '%: ' + money(c.vatAmt));
    L.push(t('total') + ': ' + money(c.total));
    if (state.currency === 'EGP') L.push('(@ ' + state.fx + ' EGP/USD)');
    L.push('');
    L.push(t('disclaimerBody'));
    return L.join('\n');
  }

  var summaryBox, savesBox;

  function updateSummary() {
    var c = calc();

      row.appendChild(el('span', 'de-selval', num((state.hours[m.id] || 0) * c.factor) + ' ' + t('hoursShort') + ' · ' + money((state.hours[m.id] || 0) * c.factor * state.rate)));
      list.appendChild(row);
    });
    if (c.trainHours > 0) {

      list.appendChild(tr);
    }
    CUSTOMIZATION_ITEMS.filter(function (i) { return state.custOn[i.id]; }).forEach(function (i) {
      var row = el('div', 'de-selrow');
      row.appendChild(el('span', 'de-selname', i[state.lang]));
      row.appendChild(el('span', 'de-selval', num(state.custHours[i.id] || 0) + ' ' + t('hoursShort') + ' · ' + money((state.custHours[i.id] || 0) * state.rate)));
      list.appendChild(row);

    INTEGRATION_ITEMS.filter(function (i) { return state.integOn[i.id]; }).forEach(function (i) {

    var sections = [

      { name: t('integration'), h: c.integH, amt: c.integAmt },

      tr.appendChild(std);

    });
    var trT = el('tr', 'de-totalrow');
    trT.appendChild(el('td', null, t('subtotal')));
    var th = el('td', null, num(c.implHours + c.trainHours + c.custH + c.integH + c.supH)); th.dir = 'ltr'; trT.appendChild(th);
    var ta = el('td', null, money(c.subtotal)); ta.dir = 'ltr'; trT.appendChild(ta);
    trT.appendChild(el('td'));
    tbody.appendChild(trT);
    if (c.discAmt > 0) {
      var trD = el('tr');
      trD.appendChild(el('td', null, t('discount') + ' ' + state.discount + '%'));
      trD.appendChild(el('td'));
      var td = el('td', null, '-' + money(c.discAmt)); td.dir = 'ltr'; trD.appendChild(td);
      trD.appendChild(el('td'));
      tbody.appendChild(trD);
    }
    if (state.vatOn) {
      var trV = el('tr');
      trV.appendChild(el('td', null, t('vat') + ' ' + state.vatRate + '%'));
      trV.appendChild(el('td'));
      var tv = el('td', null, money(c.vatAmt)); tv.dir = 'ltr'; trV.appendChild(tv);
      trV.appendChild(el('td'));
      tbody.appendChild(trV);
    }
    var trG = el('tr', 'de-grand');
    trG.appendChild(el('td', null, t('total')));
    trG.appendChild(el('td'));
    var tg = el('td', null, money(c.total)); tg.dir = 'ltr'; trG.appendChild(tg);
    trG.appendChild(el('td'));
    tbody.appendChild(trG);
    table.appendChild(tbody);
    summaryBox.appendChild(table);

    var actions = el('div', 'de-actions no-print');
    var printBtn = el('button', 'file-button is-compact', t('print'));
    printBtn.setAttribute('data-variant', 'primary');
    printBtn.addEventListener('click', function () { window.print(); });
    var copyBtn = el('button', 'file-button is-compact', t('copy'));
    copyBtn.setAttribute('data-variant', 'secondary');
    copyBtn.addEventListener('click', function () {
      var txt = buildQuoteText(calc());
      function done() { copyBtn.textContent = t('copied'); setTimeout(function () { copyBtn.textContent = t('copy'); }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, function () { window.prompt('Copy:', txt); });
      } else { window.prompt('Copy:', txt); }

      persist();
      buildUI();
    });
    actions.appendChild(printBtn);
    actions.appendChild(copyBtn);
    actions.appendChild(saveBtn);
    actions.appendChild(resetBtn);
    summaryBox.appendChild(actions);
  }

  function renderSaves() {
    savesBox.innerHTML = '';
    var saves = getSaves();
    if (!saves.length) {
      savesBox.appendChild(el('div', 'de-caption', t('noSaves')));
      return;
    }
    saves.forEach(function (s) {
      var row = el('div', 'de-selrow');
      var label = s.name + ' · ' + s.date + ' · $' + (s.total || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      row.appendChild(el('span', 'de-selname', label));
      var loadB = el('button', 'de-minibtn', t('loadLbl'));
      loadB.addEventListener('click', function () {
        var d = defaults();
        for (var k in d) if (s.state && s.state[k] !== undefined) d[k] = s.state[k];
        state = d;
        persist();
        buildUI();
        window.scrollTo(0, 0);
      });
      var delB = el('button', 'de-minibtn de-minibtn-danger', t('delLbl'));
      delB.addEventListener('click', function () {
        setSaves(getSaves().filter(function (x) { return x.id !== s.id; }));
        renderSaves();
      });
      var btnWrap = el('span', 'de-selval');
      btnWrap.appendChild(loadB);
      btnWrap.appendChild(delB);
      row.appendChild(btnWrap);
      savesBox.appendChild(row);
    });
  }

        hrs.appendChild(el('span', null, t('hoursShort')));

        cb.addEventListener('change', function () {
          state.selected[m.id] = cb.checked;
          card.className = 'de-mod' + (cb.checked ? ' on' : '');
          hrs.style.display = cb.checked ? 'flex' : 'none';
          persist(); updateSummary(); refreshFactorNote();
        });
        gm.appendChild(card);
      });
      gd.appendChild(gm);
      gMod.appendChild(gd);
    });
    wrap.appendChild(gMod);

    // Training
    var gTr = el('div', 'de-group');
    gTr.appendChild(el('h2', 'de-group-title', t('training')));
    gTr.appendChild(field(t('trainPer'), numInput(state.trainPer, function (v) { state.trainPer = v; persist(); updateSummary(); })));
    gTr.appendChild(el('div', 'de-caption', t('trainNote')));
    wrap.appendChild(gTr);

    // Customization
    var gCust = el('div', 'de-group');
    gCust.appendChild(el('h2', 'de-group-title', t('customization')));
    CUSTOMIZATION_ITEMS.forEach(function (i) {
      gCust.appendChild(lineItem(i, state.custOn, state.custHours));
    });
    wrap.appendChild(gCust);

    // Integration
    var gInt = el('div', 'de-group');
    gInt.appendChild(el('h2', 'de-group-title', t('integration')));
    INTEGRATION_ITEMS.forEach(function (i) {
      gInt.appendChild(lineItem(i, state.integOn, state.integHours));
    });
    wrap.appendChild(gInt);

    // Support
    var gSup = el('div', 'de-group');
    gSup.appendChild(el('h2', 'de-group-title', t('support')));
    var supLine = el('div', 'de-line' + (state.supportOn ? ' on' : ''));
    var supHead = el('label', 'de-line-head');
    var supCb = el('input'); supCb.type = 'checkbox'; supCb.checked = state.supportOn;
    supHead.appendChild(supCb);
    supHead.appendChild(el('span', 'de-linename', t('supportBlock')));
    supHead.appendChild(el('span', 'de-ev', state.lang === 'ar' ? 'عرض سعر سابق لـ DE' : 'Past DE quotation'));
    supLine.appendChild(supHead);
    var supHrs = el('div', 'de-line-hours');
    supHrs.dir = 'ltr';
    supHrs.style.display = state.supportOn ? 'flex' : 'none';
    supHrs.appendChild(numInput(state.supportHours, function (v) { state.supportHours = v; persist(); updateSummary(); }, { width: 64 }));
    supHrs.appendChild(el('span', null, t('hoursShort')));
    supLine.appendChild(supHrs);
    supCb.addEventListener('change', function () {
      state.supportOn = supCb.checked;
      supLine.className = 'de-line' + (supCb.checked ? ' on' : '');
      supHrs.style.display = supCb.checked ? 'flex' : 'none';
      freeWrap.style.display = supCb.checked ? 'flex' : 'none';
      persist(); updateSummary();
    });
    gSup.appendChild(supLine);

    var freeWrap = el('label', 'de-field de-check');
    freeWrap.style.display = state.supportOn ? 'flex' : 'none';
    var freeCb = el('input'); freeCb.type = 'checkbox'; freeCb.checked = state.free5;
    freeCb.addEventListener('change', function () { state.free5 = freeCb.checked; persist(); updateSummary(); });
    freeWrap.appendChild(freeCb);
    freeWrap.appendChild(el('span', null, t('freeHours')));
    gSup.appendChild(freeWrap);

    gSup.appendChild(field(t('retainer'), numInput(state.retainerHours, function (v) { state.retainerHours = v; persist(); updateSummary(); })));
    wrap.appendChild(gSup);

    // Summary
    var gSum = el('div', 'de-group');
    gSum.appendChild(el('h2', 'de-group-title', t('summary')));
    summaryBox = el('div');
    gSum.appendChild(summaryBox);
    wrap.appendChild(gSum);

    // Saved estimates
    var gSav = el('div', 'de-group no-print');
    gSav.appendChild(el('h2', 'de-group-title', t('savedEstimates')));
    savesBox = el('div');
    gSav.appendChild(savesBox);
    wrap.appendChild(gSav);

    wrap.appendChild(el('div', 'de-closing', t('closing')));
    root.appendChild(wrap);

    updateSummary();
    renderSaves();
  }

  function lineItem(i, onMap, hoursMap) {
    var row = el('div', 'de-line' + (onMap[i.id] ? ' on' : ''));
    var head = el('label', 'de-line-head');
    var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!onMap[i.id];
    head.appendChild(cb);
    head.appendChild(el('span', 'de-linename', i[state.lang]));
    head.appendChild(el('span', 'de-ev', i.ev[state.lang]));
    row.appendChild(head);
    var hrs = el('div', 'de-line-hours');
    hrs.dir = 'ltr';
    hrs.style.display = onMap[i.id] ? 'flex' : 'none';
    if (i.flatPrice) {
      hrs.appendChild(el('span', null, money(i.flatPrice) + ' ' + t('perMonth')));
    } else {
      hrs.appendChild(numInput(hoursMap[i.id], function (v) { hoursMap[i.id] = v; persist(); updateSummary(); }, { width: 64 }));
      hrs.appendChild(el('span', null, t('hoursShort')));
    }
    row.appendChild(hrs);
    cb.addEventListener('change', function () {
      onMap[i.id] = cb.checked;
      row.className = 'de-line' + (cb.checked ? ' on' : '');
      hrs.style.display = cb.checked ? 'flex' : 'none';
      persist(); updateSummary();
    });
    return row;
  }

  function refreshFactorNote() {
    var c = calc();
    var fn = document.getElementById('de-factornote');
    if (fn) fn.textContent = t('usersFactorNote') + ': ×' + c.uFactor + ' · ' + t('complexity') + ': ×' + c.cFactor + ' · ' + t('companies') + ': ×' + c.coFactor.toFixed(2) + ' → ' + t('factorLine') + ' ×' + c.factor.toFixed(2);
  }

  buildUI();
})();

</script>
</body>
</html>
