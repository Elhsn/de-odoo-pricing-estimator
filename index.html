for(let [items,on,hrs,cat] of [[CUSTOMIZATION_ITEMS,v.custOn,v.custHours,'customization'],[INTEGRATION_ITEMS,v.integOn,v.integHours,'integration']])items.filter(i=>on?.[i.id]).forEach(i=>{let h=hrs?.[i.id]||0;d.lines.push(line({name:i[d.lang],category:cat,hours:h,low:h,high:h,rate:d.rate,model:i.flatPrice?'fixed':'hours',fee:i.flatPrice?(v.integFlat?.[i.id]??i.flatPrice):0,cadence:i.flatPrice?'month':'once',source:i.ev[d.lang],evidence:'historical'}))});

function money(v){let x=v;if(state.displayCurrency!==state.currency)x=v*Number(state.fx);return new Intl.NumberFormat(state.lang==='ar'?'ar-EG':'en-US',{style:'currency',currency:state.displayCurrency,maximumFractionDigits:2}).format(x)}
function centsProduct(values){let n=1n,den=1n;for(let v of values){let t=String(v);if(!/^-?\d+(\.\d+)?$/.test(t)){t=Number(v).toFixed(8)}let neg=t.startsWith('-');if(neg)t=t.slice(1);let [a,b='']=t.split('.');n*=BigInt(a+b)*(neg?-1n:1n);den*=10n**BigInt(b.length)}let scaled=n*100n;return Number((scaled+den/2n)/den)/100}
function calc(s=state,band='hours'){let out={once:{net:0,tax:0,total:0},month:{net:0,tax:0,total:0},year:{net:0,tax:0,total:0},contract:0,unknown:false,cost:0,revenue:0,costComplete:true,rows:[]};for(let l of s.lines){if(l.inclusion!=='included')continue;let h=Number(l[band]);let base=centsProduct(l.model==='fixed'?[l.quantity,l.fee]:[l.quantity,h,l.rate]);let disc=l.discountable?centsProduct([base,s.discount,.01]):0;let net=base-disc,tax=l.taxable?centsProduct([net,s.tax,.01]):0,total=rnd(net+tax);let o=out[l.cadence];o.net=rnd(o.net+net);o.tax=rnd(o.tax+tax);o.total=rnd(o.total+total);let term=l.cadence==='once'?1:(l.periods!==''?Number(l.periods):(s.duration!==''?(l.cadence==='month'?Number(s.duration):Number(s.duration)/12):null));if(term===null||!Number.isFinite(term)||term<0)out.unknown=true;else out.contract=rnd(out.contract+total*term);out.rows.push({l,base,disc,net,tax,total,term});if(l.category!=='thirdparty'&&term!==null){out.revenue=rnd(out.revenue+net*term);if(l.cost==='')out.costComplete=false;else out.cost=rnd(out.cost+Number(l.cost)*Number(l.quantity)*term)}}return out}
function issues(){let errors=[],warnings=[];if(!state.reference.trim())errors.push(T('Quotation reference is required.','مرجع عرض السعر مطلوب.'));if(!state.scope.trim())errors.push(T('Agreed scope is required.','النطاق مطلوب.'));if(!state.lines.some(l=>l.inclusion==='included'))errors.push(T('Add at least one included line.','أضف بندًا مشمولًا واحدًا.'));if(state.url&&!validURL(state.url))errors.push(T('Quotation URL must use http or https.','الرابط يجب أن يبدأ بـhttp أو https.'));if(state.discount<0||state.discount>100||!Number.isFinite(Number(state.discount)))errors.push(T('Discount must be 0–100%.','الخصم بين 0 و100%.'));if(state.tax<0||!Number.isFinite(Number(state.tax)))errors.push(T('Invalid tax rate.','معدل ضريبة غير صالح.'));if(state.displayCurrency!==state.currency&&(!(state.fx>0)||!Number.isFinite(Number(state.fx))))errors.push(T('Positive FX required.','سعر صرف موجب مطلوب.'));for(let l of state.lines){if(!l.name.trim())errors.push(T('Every line needs a name.','كل بند يحتاج اسمًا.'));for(let k of ['quantity','low','hours','high','rate','fee','complimentary'])if(!Number.isFinite(Number(l[k]))||Number(l[k])<0)errors.push(T('Negative or invalid line number.','قيمة سالبة أو غير صالحة.'));if(Number(l.low)>Number(l.hours)||Number(l.hours)>Number(l.high))errors.push(T('Hours must follow low ≤ base ≤ high.','الساعات: منخفض ≤ أساسي ≤ مرتفع.'));if(l.cadence==='year'&&l.periods===''&&Number(state.duration)%12!==0)errors.push(T('Annual lines require explicit whole billable periods when term is not whole years.','البنود السنوية تحتاج عدد فترات صريحًا صحيحًا إذا لم تكن المدة سنوات كاملة.'));if(l.periods!==''&&(!Number.isInteger(Number(l.periods))||Number(l.periods)<=0))errors.push(T('Billable periods must be positive whole numbers.','فترات الفوترة أعداد صحيحة موجبة.'));if(l.cost!==''&&(!Number.isFinite(Number(l.cost))||l.cost<0))errors.push(T('Invalid delivery cost.','تكلفة تنفيذ غير صالحة.'));if(l.cadence!=='once'&&(l.periods!==''?!(Number(l.periods)>0):!(Number(state.duration)>0)))errors.push(T('Recurring lines need a positive term or periods.','البنود الدورية تحتاج مدة أو عدد فترات موجبًا.'))}
if(!state.reviewed||!state.reviewer||!state.reviewDate)warnings.push(T('Review checklist is incomplete; this is not authenticated approval.','المراجعة ناقصة، وهي ليست اعتمادًا موثقًا بهوية.'));if(!state.acceptance||!state.exclusions)warnings.push(T('Acceptance/exclusions are incomplete.','القبول/الاستثناءات ناقصة.'));if(state.tax&&!state.taxBasis)warnings.push(T('Tax basis is not recorded.','أساس الضريبة غير مسجل.'));if(state.displayCurrency!==state.currency&&!state.fxBasis)warnings.push(T('FX basis is missing.','أساس الصرف مفقود.'));if(state.hosting==='online'&&state.lines.some(l=>l.category==='development'))warnings.push(T('Odoo Online cannot run custom modules. Review hosting.','Online لا يشغل وحدات خاصة. راجع الاستضافة.'));if(!state.country)warnings.push(T('Country/localization is not specified.','الدولة/التوطين غير محددين.'));if(state.lines.some(l=>l.evidence==='assumption'||l.evidence==='historical'))warnings.push(T('Assumptions/historical amounts require project-specific review.','الافتراضات/المبالغ التاريخية تحتاج مراجعة للمشروع.'));if(['migration','integration','rescue','upgrade'].includes(state.scenario)&&!state.risks)warnings.push(T('Document volumes, endpoint/code assumptions and risks for this scenario.','وثّق الأحجام وافتراضات الأنظمة/الكود ومخاطر السيناريو.'));return{errors:[...new Set(errors)],warnings}}

function reviewPanel(){let q=issues();return `<section class="panel"><h2>${T('Review & export','المراجعة والتصدير')}</h2><p class="muted">${T('This checklist is not identity-verified management approval. A quote is issued separately by DE.','قائمة المراجعة ليست اعتماد إدارة موثق الهوية. يصدر عرض السعر من DE بشكل منفصل.')}</p><div class="grid">${select('status','Status','الحالة',[['draft','Draft','مسودة'],['review','Ready for review','جاهز للمراجعة'],['recorded','Review recorded','مراجعة مسجلة']])}${field('reviewer','Reviewer name (record only)','اسم المراجع (للتسجيل فقط)')}${field('reviewDate','Review date','تاريخ المراجعة','date')}</div>${check('reviewed','I checked scope, amounts, tax, recurring term, source assumptions and export audience.','راجعت النطاق والمبالغ والضريبة والمدة ومصادر الافتراض وجمهور التصدير.')}<div id="validation"></div><div class="actions">${button('save','Save browser estimate','حفظ تقدير بالمتصفح')}${button('backup','Export backup JSON','تصدير احتياطي JSON')}${button('import','Import backup / v2','استيراد نسخة / v2')}${button('client','Client preview','معاينة العميل')}${button('print','Print / PDF: client','طباعة / PDF: العميل','class="primary"')}${button('internalprint','Print / PDF: internal','طباعة / PDF: داخلي')}${button('copy','Copy client summary','نسخ ملخص العميل')}${button('duplicate','Duplicate as new','نسخ كتقدير جديد')}${button('new','New blank estimate','تقدير جديد فارغ')}</div><input type="file" id="importfile" accept=".json,application/json" class="hide"><p class="warn">${T('Exports contain quote/client data. A URL can grant portal access. Keep backups private. Client export excludes internal effort, costs, margin and notes.','التصدير يحمل بيانات العميل/العرض. الرابط قد يمنح دخول البوابة. احتفظ بالنسخ خاصة. تصدير العميل يخفي الجهد والتكلفة والهامش والملاحظات الداخلية.')}</p></section>`}
function savesPanel(){let v=saves();let old=[];try{old=JSON.parse(localStorage.getItem('de-estimator-saves-v2')||'[]')}catch(e){}return `<section class="panel"><h2>${T('Saved on this browser','المحفوظ على هذا المتصفح')}</h2><p>${T('No team synchronization. Export a backup before switching devices. Legacy saves are retained, not overwritten.','بلا مزامنة للفريق. صدّر نسخة قبل تغيير الجهاز. المحفوظات القديمة باقية دون استبدال.')}</p>${v.map((x,i)=>`<div class="save-row"><strong>${escape(x.name)}</strong><span>${escape(x.date)}</span><button data-load="${i}">${T('Load','تحميل')}</button><button data-delete="${i}">${T('Delete','حذف')}</button></div>`).join('')||`<p>${T('No v3 saves yet.','لا محفوظات v3 بعد.')}</p>`}${old.length?`<h3>${T('Legacy v2 saves','محفوظات v2 القديمة')}</h3>`+old.map((x,i)=>`<div class="save-row"><strong>${escape(x.name||x.state?.clientName||'v2 '+(i+1))}</strong><button data-legacy="${i}">${T('Import copy','استيراد نسخة')}</button></div>`).join(''):''}</section>`}
function renderPreview(){let c=calc(),q=issues(),low=calc(state,'low'),high=calc(state,'high');let title=T('Quotation preview','معاينة عرض السعر');let meta=`${escape(state.reference||state.id)} · ${T('Revision','إصدار')} ${escape(state.revision)} · ${escape(state.date)}`;let amount=(o)=>`${money(o.total)}<small>${T('Net','صافي')} ${money(o.net)} · ${T('Tax','ضريبة')} ${money(o.tax)}</small>`;$('#preview').innerHTML=`<div class="print-head">Digital Economics · Odoo Partner · ${meta}</div><div class="no-print actions">${button('toggleview',clientView?'Edit estimate':'Show client-only preview',clientView?'تحرير التقدير':'معاينة العميل فقط')}</div><div class="quote"><div class="eyebrow">${T('Draft · subject to DE review','مسودة · تخضع لمراجعة DE')}</div><h2>${title}</h2><h3>${escape(state.project||T('Untitled project','مشروع بلا عنوان'))}</h3><p>${escape(state.client)}<br>${meta}</p>${state.url&&validURL(state.url)?`<p><a href="${escape(state.url)}" target="_blank" rel="noopener noreferrer">${escape(state.url)}</a></p>`:''}<div class="totals"><div class="total">${T('One-time','مرة واحدة')}<b>${money(c.once.total)}</b><small>${T('Net','صافي')} ${money(c.once.net)} · ${T('Tax','ضريبة')} ${money(c.once.tax)}</small></div><div class="total">${T('Monthly','شهري')}<b>${money(c.month.total)}</b><small>${T('Per month, before term multiplication','لكل شهر قبل ضرب المدة')}</small></div><div class="total">${T('Annual','سنوي')}<b>${money(c.year.total)}</b><small>${T('Per year, not per month','لكل سنة لا شهر')}</small></div></div><p class="amount">${T('Contract total','إجمالي العقد')}: ${c.unknown?T('Term required','المدة مطلوبة'):money(c.contract)}</p><p class="muted">${T('Contract term (months)','مدة العقد (شهور)')}: ${escape(state.duration||'—')} · ${T('Quote currency','عملة العرض')}: ${escape(state.currency)}${state.displayCurrency!==state.currency?` · ${T('Display conversion','تحويل عرض')} ×${escape(state.fx)} · ${escape(state.fxBasis)}`:''}</p>${!clientView?`<p class="muted">${T('Low / base / high contract budget','ميزانية العقد منخفضة / أساسية / مرتفعة')}: ${c.unknown?'—':money(low.contract)+' / '+money(c.contract)+' / '+money(high.contract)}</p>`:''}<h3>${T('Services','الخدمات')}</h3>${state.lines.map(l=>{let row=c.rows.find(x=>x.l.id===l.id);let included=l.inclusion==='included';return `<div class="quote-row"><div><strong>${escape(l.name)}</strong><small>${num(Number(l.quantity))} ${escape(l.unit)} · ${T(l.cadence==='once'?'One-time':l.cadence==='month'?'Monthly':'Annual',l.cadence==='once'?'مرة واحدة':l.cadence==='month'?'شهري':'سنوي')} · ${T(l.inclusion,l.inclusion==='included'?'مشمول':l.inclusion==='optional'?'اختياري':'مستبعد')}${l.cadence!=='once'?' · '+T('Billable periods','فترات الفوترة')+': '+escape(l.periods|| (state.duration?(l.cadence==='month'?state.duration:Number(state.duration)/12):'—')):''}</small>${l.notes?`<p>${escape(l.notes)}</p>`:''}${!clientView?`<small>${T('Hours low/base/high','ساعات منخفضة/أساسية/مرتفعة')}: ${num(Number(l.low))}/${num(Number(l.hours))}/${num(Number(l.high))} · ${T('Rate','معدل')} ${money(Number(l.rate))} · ${T('Free hours','ساعات مجانية')} ${num(Number(l.complimentary))}<br>${escape(l.evidence)} · ${escape(l.source)} ${escape(l.sourceDate)}<br>${T('Internal','داخلي')}: ${escape(l.internal)} · ${T('Cost','تكلفة')} ${l.cost===''?'—':money(Number(l.cost))}</small>`:''}</div><div class="amount">${row?money(row.total):included?'—':T('Outside total','خارج الإجمالي')}</div></div>`}).join('')}${[['scope','Scope','النطاق'],['exclusions','Exclusions','الاستثناءات'],['dependencies','Dependencies','المتطلبات'],['acceptance','Acceptance','القبول'],['clientNotes','Notes','الملاحظات'],['payments','Payments','الدفعات'],['supportTerms','Support & warranty','الدعم والضمان'],['terms','Terms','الشروط']].filter(x=>state[x[0]]).map(x=>`<h3 style="margin-top:24px">${T(x[1],x[2])}</h3><p class="summary-text">${escape(state[x[0]])}</p>`).join('')}<p>${T('Validity','الصلاحية')}: ${escape(state.validity||T('Not set','غير محددة'))}</p>${!clientView?`<h3>${T('Internal review only','للمراجعة الداخلية فقط')}</h3><p class="summary-text">${escape(state.internalNotes)}<br>${escape(state.risks)}<br>${escape(state.rateBasis)}</p><p>${T('Recorded reviewer','المراجع المسجل')}: ${escape(state.reviewer||'—')} · ${escape(state.reviewDate)} · ${escape(state.status)}</p><p>${T('Service margin','هامش الخدمة')}: ${c.costComplete&&c.revenue>0&&!c.unknown?num((c.revenue-c.cost)/c.revenue*100)+'%':T('Not available without complete cost inputs and term','غير متاح دون تكاليف ومدة كاملة')}</p>`:''}<p class="muted">${T('Odoo licenses, hosting and third-party costs are excluded unless itemized. This estimate does not replace an approved DE quotation.','تراخيص أودو والاستضافة وتكاليف الغير مستبعدة إلا إذا ذُكرت كبنود. لا يحل التقدير محل عرض DE معتمد.')}</p></div>`;
let v=$('#validation');if(v)v.innerHTML=q.errors.map(x=>`<p class="error">${escape(x)}</p>`).join('')+q.warnings.map(x=>`<p class="warn">${escape(x)}</p>`).join('')+(!q.errors.length?`<p class="notice">${T('Required fields pass. Review warnings before issuing a quotation.','الحقول المطلوبة سليمة. راجع التحذيرات قبل إصدار العرض.')}</p>`:'');document.querySelectorAll('[data-line-amount]').forEach(e=>{let r=c.rows.find(x=>x.l.id===e.dataset.lineAmount);e.textContent=r?money(r.total):T('Not included in total','غير مشمول بالإجمالي')});bindPreview()}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=Number(e.dataset.tab);render()});document.querySelectorAll('[data-state],[data-line][data-key]').forEach(e=>e.oninput=()=>{let obj=e.dataset.state?state:state.lines.find(l=>l.id===e.dataset.line),key=e.dataset.state||e.dataset.key;let v=e.type==='checkbox'?e.checked:e.type==='number'?(e.value===''?'':Number(e.value)):e.value;obj[key]=v;if(obj!==state&&['hours','low','high'].includes(key)&&key==='hours'){if(Number(obj.low)>Number(v))obj.low=v;if(Number(obj.high)<Number(v))obj.high=v;for(let k of ['low','high']){let c=document.querySelector('[data-line="'+obj.id+'"][data-key="'+k+'"]');if(c)c.value=obj[k]}}persist();renderPreview()});document.querySelectorAll('select[data-state],select[data-line]').forEach(e=>e.onchange=()=>{e.oninput();render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.lines=state.lines.filter(l=>l.id!==e.dataset.remove);persist();render()});document.querySelectorAll('[data-module]').forEach(e=>e.onclick=()=>{let m=MODULE_GROUPS.flatMap(g=>g.modules).find(m=>m.id===e.dataset.module);state.lines.push(line({name:m[state.lang],rate:state.rate,category:'implementation',hours:m.hours,low:m.hours,high:m.hours,source:T('Legacy catalogue hours: unapproved assumption','ساعات القائمة القديمة: افتراض غير معتمد')}));persist();render()});document.querySelectorAll('[data-load]').forEach(e=>e.onclick=()=>{if(!confirm(T('Replace working estimate? Current changes are auto-saved but not added to named saves.','استبدال التقدير الجاري؟ التغييرات محفوظة تلقائيًا لا كنسخة مسماة.')))return;state=validate(saves()[e.dataset.load].state);persist();tab=0;render()});document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{if(confirm(T('Delete this named save?','حذف هذه النسخة؟'))){let v=saves();v.splice(Number(e.dataset.delete),1);setSaves(v);render()}});document.querySelectorAll('[data-legacy]').forEach(e=>e.onclick=()=>{let old=JSON.parse(localStorage.getItem('de-estimator-saves-v2')||'[]')[e.dataset.legacy];state=migrate(old.state||old.data||old);persist();tab=0;render()});let input=$('#importfile');if(input)input.onchange=async()=>{try{let f=input.files[0];if(!f||f.size>2000000)throw Error('File too large');let j=JSON.parse(await f.text());let v=j.state||j;let next=v.schema===3?validate(v):v.selected&&typeof v.selected==='object'?migrate(v):null;if(!next)throw Error('Unsupported backup');if(!confirm(T('Replace working estimate with this backup?','استبدال التقدير الجاري بهذه النسخة؟')))return;state=next;persist();importMessage=T('Imported. Check scope, term and rates.','تم الاستيراد. راجع النطاق والمدة والأسعار.');render()}catch(e){alert(T('Import rejected: ','رفض الاستيراد: ')+e.message)}};document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action))}
function bindPreview(){document.querySelectorAll('#preview [data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action))}
function backup(){let blob=new Blob([JSON.stringify({format:'DE estimate backup',version:3,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.reference||state.id).replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function summary(){let c=calc();return ['Digital Economics | Odoo Partner',state.client,state.project,state.reference+' | '+state.revision+' | '+state.date,state.url&&validURL(state.url)?state.url:'',T('One-time','مرة واحدة')+': '+money(c.once.total),T('Monthly','شهري')+': '+money(c.month.total),T('Annual','سنوي')+': '+money(c.year.total),T('Contract','العقد')+': '+(c.unknown?'—':money(c.contract)),...state.lines.filter(l=>l.inclusion==='included').map(l=>l.name),state.scope,state.exclusions,state.dependencies,state.acceptance,state.clientNotes,state.payments,state.supportTerms,state.terms,T('Draft, subject to DE review.','مسودة تخضع لمراجعة DE.')].filter(Boolean).join('\n\n')}
function action(a){if(a==='add'){state.lines.push(line({rate:state.rate}));persist();render()}if(a==='catalog')$('#catalog').classList.toggle('hide');if(['discovery','focused','connected'].includes(a)){let templates={discovery:[['Workshops','ورش عمل'],['Fit/gap & blueprint','الفجوات وتصميم الحل'],['Estimate & readout','التقدير وعرض النتائج']],focused:[['Scope validation','تثبيت النطاق'],['Configuration','الإعداد'],['Data import','استيراد البيانات'],['Testing & UAT','الاختبار والقبول'],['Training','التدريب'],['Cutover & hypercare','الإطلاق والرعاية'],['Coordination & documentation','التنسيق والتوثيق']],connected:[['Design','التصميم'],['Configuration','الإعداد'],['Migration','الترحيل'],['Testing & UAT','الاختبار والقبول'],['Training','التدريب'],['Cutover & hypercare','الإطلاق والرعاية'],['Coordination & documentation','التنسيق والتوثيق']]};templates[a].forEach(x=>state.lines.push(line({name:T(...x),rate:state.rate,source:T('Unpriced workstream template; set team estimate','قالب مسارات دون تسعير؛ أدخل تقدير الفريق')})));persist();render()}if(a==='save'){let name=prompt(T('Save name','اسم النسخة'),state.reference||state.project||state.id);if(name){let v=saves();v.unshift({name,date:new Date().toLocaleString(),state:JSON.parse(JSON.stringify(state))});setSaves(v);alert(T('Saved on this browser.','تم الحفظ على هذا المتصفح.'))}}if(a==='backup')backup();if(a==='import')$('#importfile').click();if(a==='client'||a==='toggleview'){clientView=!clientView;render();window.scrollTo(0,0)}if(a==='print'||a==='internalprint'){let q=issues();if(q.errors.length){tab=3;clientView=false;render();alert(T('Fix required fields before final export.','صحح الحقول المطلوبة قبل التصدير النهائي.'));return}if(q.warnings.length&&!confirm(T('Review warnings remain. Print as draft?','توجد تحذيرات مراجعة. الطباعة كمسودة؟')))return;let prev=clientView;internalPrint=a==='internalprint';clientView=!internalPrint;render();window.print();clientView=prev;internalPrint=false;render()}if(a==='copy'){if(issues().errors.length){alert(T('Complete required fields before copying.','أكمل الحقول المطلوبة قبل النسخ.'));return}navigator.clipboard.writeText(summary()).then(()=>alert(T('Client summary copied.','تم نسخ ملخص العميل.'))).catch(()=>alert(T('Clipboard unavailable. Use print/PDF.','النسخ غير متاح. استخدم الطباعة.')))}if(a==='duplicate'){state.id=uid();state.reference='';state.revision='1';state.reviewed=false;state.reviewer='';state.reviewDate='';persist();tab=0;render()}if(a==='new'&&confirm(T('Start blank? Export a backup first if needed.','بدء تقدير فارغ؟ صدّر نسخة أولًا إذا لزم.'))){let lang=state.lang;state=defaults();state.lang=lang;persist();render()}}
let printPrevious=false,internalPrint=false;window.addEventListener('beforeprint',()=>{printPrevious=clientView;if(!internalPrint){clientView=true;render()}});window.addEventListener('afterprint',()=>{clientView=printPrevious;internalPrint=false;render()});
$('#language').onclick=()=>{state.lang=state.lang==='ar'?'en':'ar';persist();render()};window.DE_TEST={calc,validate,migrate,issues,getState:()=>state};render();
})();

</script></body></html>
